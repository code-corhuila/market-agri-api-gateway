# Stand-in of a service for the smoke test: its GET /health (api-contract E-60), plus the
# Authorization it received, so the test can tell the gateway sent no credential; and any /api/
# path, answered with what the gateway forwarded.
server {
    listen 8080;
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","authorization":"$http_authorization"}';
    }
    # Any API path: echoes what reached the service, so the test can check what the gateway forwards.
    location /api/ {
        default_type application/json;
        return 200 '{"service":"$hostname","path":"$uri","authorization":"$http_authorization","xUserId":"$http_x_user_id","correlationId":"$http_x_correlation_id"}';
    }
    # A photo (E-62), as catalog-api answers it: its own Cache-Control, a body naming the service.
    location /media/ {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        return 200 'photo of $hostname: $uri';
    }
    location / {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND"}';
    }
}
