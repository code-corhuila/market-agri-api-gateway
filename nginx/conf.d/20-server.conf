server {
    listen 8080;
    server_name _;

    include /etc/nginx/snippets/headers.conf;

    # The gateway's own errors, with the common error body (api-contract §2). Errors returned by
    # a service pass through untouched: they already carry the body.
    error_page 401 = @unauthorized;
    error_page 404 = @not_found;
    error_page 413 = @payload_too_large;
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @unavailable;

    include /etc/nginx/routes/*.conf;

    # An /api/ path that no route file claims.
    location /api/ {
        return 404;
    }

    # The internal API of the services is reached inside the platform only, never here (D-C27).
    location /internal/ {
        return 404;
    }

    location @unauthorized {
        include /etc/nginx/snippets/headers.conf;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header WWW-Authenticate Bearer always;
        default_type application/json;
        return 401 '{"error":"UNAUTHORIZED","message":"Debe iniciar sesión para continuar.","details":[],"traceId":"$correlation_id"}';
    }

    location @too_many_requests {
        include /etc/nginx/snippets/headers.conf;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Retry-After 60 always;
        default_type application/json;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"Demasiadas solicitudes. Intente de nuevo más tarde.","details":[],"traceId":"$correlation_id"}';
    }

    # A body over client_max_body_size (nginx.conf): the only large upload is a photo (D-C30).
    location @payload_too_large {
        include /etc/nginx/snippets/headers.conf;
        add_header Access-Control-Allow-Origin $cors_origin always;
        default_type application/json;
        return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"La imagen supera el máximo de 5 MB.","details":[],"traceId":"$correlation_id"}';
    }

    location @not_found {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND","message":"El recurso solicitado no existe.","details":[],"traceId":"$correlation_id"}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"El servicio no está disponible en este momento.","details":[],"traceId":"$correlation_id"}';
    }
}
