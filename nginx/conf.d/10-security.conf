# X-Correlation-Id (Annex F, api-contract D-C28): reuse the client's value when it is safe (the
# same rule as the services' CorrelationFilter), otherwise generate one.
map $http_x_correlation_id $client_correlation_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_correlation_id;
    default "";
}

# $request_id is 32 random hex digits; written as a UUID, like the ids the services generate.
map $request_id $generated_correlation_id {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" "$a-$b-$c-$d-$e";
}

map $client_correlation_id $correlation_id {
    "" $generated_correlation_id;
    default $client_correlation_id;
}

# CORS (Annex F, ADR-017): only the container's development origin, when its dev server talks to a
# gateway on another port. On the platform everything is one origin and no CORS is needed. An
# unknown origin gets an empty value, and NGINX sends no header with an empty value.
map $http_origin $cors_origin {
    "http://localhost:5173" $http_origin;
    default "";
}

# A general per-IP ceiling on writes (cross-cutting.md §9): reads and preflights have an empty key,
# and NGINX does not count a request whose key is empty. Over the limit: 429 (20-server.conf). The
# login is left out: it has its own, stricter zone below.
map "$request_method $uri" $write_limit_key {
    "~^(GET|HEAD|OPTIONS) "     "";
    "POST /api/v1/auth/login"   "";
    default                     $binary_remote_addr;
}
limit_req_zone $write_limit_key zone=api_writes:10m rate=30r/m;

# The own limit of the login (D-C29, HU-AUTH-005, FR-009): 10 attempts per IP in 5 minutes. One
# every 30 s refills the bucket, and the burst of 9 lets the first 10 through at once; the 11th
# answers 429 with Retry-After (20-server.conf) and never reaches auth-api.
map "$request_method $uri" $login_limit_key {
    "POST /api/v1/auth/login"   $binary_remote_addr;
    default                     "";
}
limit_req_zone $login_limit_key zone=auth_login:10m rate=2r/m;
limit_req_status 429;

# Credential filter of catalog (Annex F: a cheap check; the service validates the token). Anonymous
# cards (D-C9): E-10, E-11, E-19, E-20 and every preflight. Anything else needs Authorization;
# "products/mine" (E-12) is a GET that needs it, so it is matched first.
map "$request_method $uri" $catalog_anonymous {
    "~^OPTIONS "                                                  1;
    "~^(GET|HEAD) /api/v1/catalog/products/mine$"                 0;
    "~^(GET|HEAD) /api/v1/catalog/(products(/[^/]+)?|categories|units)$" 1;
    default                                                       0;
}
map "$catalog_anonymous:$http_authorization" $catalog_without_credential {
    "0:"    1;
    default 0;
}

# Credential filter of transactions: every card needs Authorization (E-41, E-42, E-44, E-45) except
# the provider's webhook, a POST whose checksum is its authentication (E-43, ADR-019), and the preflights.
map "$request_method $uri" $transactions_anonymous {
    "~^OPTIONS "                                               1;
    "~^POST /api/v1/transactions/webhooks/payment-gateway$"    1;
    default                                                    0;
}
map "$transactions_anonymous:$http_authorization" $transactions_without_credential {
    "0:"    1;
    default 0;
}

# Credential filter of auth: the cards that create or open a session are anonymous (E-01 register,
# E-02 login, E-03 refresh: POST) and so is the published key (E-05: GET), plus the preflights.
# Everything else (E-04, E-06, E-07, E-08) needs Authorization. No own limit for the login (D-C29,
# HU-AUTH-005, out of this delivery): the shared write limit applies.
map "$request_method $uri" $auth_anonymous {
    "~^OPTIONS "                                       1;
    "~^POST /api/v1/auth/(register|login|refresh)$"    1;
    "~^(GET|HEAD) /api/v1/auth/jwks$"                  1;
    default                                            0;
}
map "$auth_anonymous:$http_authorization" $auth_without_credential {
    "0:"    1;
    default 0;
}
