# X-Correlation-Id (Annex F, api-contract D-C28): reuse the client's value when it is safe (the
# same rule as the services' CorrelationFilter), otherwise generate one.
map $http_x_correlation_id $client_correlation_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_correlation_id;
    default "";
}

# $request_id is 32 random hex digits; written as a UUID, like the ids the services generate.
map $request_id $generated_correlation_id {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" "$a-$b-$c-$d-$e";
}

map $client_correlation_id $correlation_id {
    "" $generated_correlation_id;
    default $client_correlation_id;
}

# Rate-limit zones, CORS origins and the credential filter arrive with the API routes.
