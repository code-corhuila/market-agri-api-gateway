# Global settings of the gateway (Annex F). Configuration, not code: no Lua, no njs.
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # A product photo is at most 5 MB (api-contract D-C30); a little room for the multipart body.
    client_max_body_size 6m;

    # One JSON line per request, with the correlation id the services log too (Annex G).
    log_format json escape=json
        '{"time":"$time_iso8601","correlationId":"$correlation_id","method":"$request_method",'
        '"path":"$uri","status":$status,"upstream":"$upstream_addr","durationSeconds":$request_time}';
    access_log /dev/stdout json;

    include /etc/nginx/conf.d/*.conf;
}
