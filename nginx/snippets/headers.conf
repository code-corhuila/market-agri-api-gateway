# Headers every response carries. Included in the server and in every location that adds its own
# headers: NGINX drops the outer add_header as soon as a location declares one (Annex F).
add_header X-Correlation-Id $correlation_id always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# No page of the platform may be framed (clickjacking). A full Content-Security-Policy waits for the
# portals' origins (Module Federation, ADR-021): it would have to list them.
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
