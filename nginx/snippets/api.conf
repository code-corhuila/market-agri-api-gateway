# What every /api/v1/<domain>/ location does (Annex F): CORS for the container's dev origin, the
# write limit, and only Authorization and X-Correlation-Id towards the service (D-C28). Declaring a
# header drops the server's, hence headers.conf again. The location sets its upstream first.
include /etc/nginx/snippets/headers.conf;
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Expose-Headers "X-Correlation-Id, Location" always;
add_header Vary Origin always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Correlation-Id" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;
    return 204;
}

limit_req zone=api_writes burst=10 nodelay;

include /etc/nginx/snippets/proxy.conf;
# Identity comes only from the JWT, so no X-User-* header reaches a service (D-C28).
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
proxy_set_header X-User-Name "";
proxy_set_header X-User-Email "";
