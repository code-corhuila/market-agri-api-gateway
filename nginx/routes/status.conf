# The services panel of the container (HU-PLAT-010, ADR-017): /status/<service> → that service's
# GET /health (api-contract E-60), from the same origin as the page. GET only and no credential:
# the panel reads liveness, nothing else. A service down is the gateway's own 503 (20-server.conf).
# Service names follow their repositories: <domain>-api, and the -workflow repository's workflow.
location ~ ^/status/(auth|catalog|chat|transactions)$ {
    set $status_upstream http://$1-api:8080/health;
    include /etc/nginx/snippets/status.conf;
}

location = /status/workflow {
    set $status_upstream http://workflow:8080/health;
    include /etc/nginx/snippets/status.conf;
}

# Any other name or path under /status/ is not a service; it must not fall through to the container.
location /status/ {
    return 404;
}
