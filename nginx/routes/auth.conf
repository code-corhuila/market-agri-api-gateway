# auth (ADR-017, F6): /api/v1/auth/ → auth-api, resolved on every request. The credential filter
# ($auth_without_credential, 10-security.conf) answers 401 before the service is called; the service
# still validates the token (ADR-020). I-01 lives under /internal/: never routed (D-C27). The login
# has its own limit (D-C29): 10 attempts per IP in 5 minutes.
location /api/v1/auth/ {
    set $auth_api http://auth-api:8080;
    if ($auth_without_credential) {
        return 401;
    }
    # Only the login has a key in this zone (10-security.conf); the other routes pass through.
    limit_req zone=auth_login burst=9 nodelay;
    include /etc/nginx/snippets/api.conf;
    proxy_pass $auth_api;
}
