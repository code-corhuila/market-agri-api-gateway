# Workflow (ADR-017): preserve the E-40/E-46 path and let the service validate the token.
location /api/v1/workflow/ {
    set $workflow_api http://workflow:8080;
    if ($workflow_without_credential) {
        return 401;
    }
    include /etc/nginx/snippets/api.conf;
    proxy_pass $workflow_api;
}
