# Chat (ADR-017, HU-PLAT-005): E-30…E-34 keep their path and the service validates the token. The
# WebSocket of HU-CHAT-002 will add its upgrade here; I-05 stays internal (/internal/ is never routed).
location /api/v1/chat/ {
    set $chat_api http://chat-api:8080;
    if ($chat_without_credential) {
        return 401;
    }
    include /etc/nginx/snippets/api.conf;
    proxy_pass $chat_api;
}
