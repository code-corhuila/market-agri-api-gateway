# catalog (ADR-017, E4b): /api/v1/catalog/ → catalog-api, resolved on every request. The credential
# filter ($catalog_without_credential, 10-security.conf) answers 401 before the service is called;
# the service still validates the token (ADR-020). The service's own errors pass through untouched.
location /api/v1/catalog/ {
    set $catalog_api http://catalog-api:8080;
    if ($catalog_without_credential) {
        return 401;
    }
    include /etc/nginx/snippets/api.conf;
    proxy_pass $catalog_api;
}

# E-62 (D-C30): the photos of the catalog are anonymous by design (an <img> cannot send a token), so
# no credential filter and no CORS. catalog-api answers the bytes with their Cache-Control.
location /media/ {
    set $catalog_api http://catalog-api:8080;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $catalog_api;
}
