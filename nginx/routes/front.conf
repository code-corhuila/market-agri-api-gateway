# The web interface: the container (market-agri-front) answers every path that is not an API
# route, so the browser loads the application and its client-side routes from the same origin as
# the API (no CORS for the container, VITE_GATEWAY_URL empty). The portals: portals.conf.
location / {
    set $front_upstream http://front:80;
    proxy_pass $front_upstream;
    include /etc/nginx/snippets/proxy.conf;
}
