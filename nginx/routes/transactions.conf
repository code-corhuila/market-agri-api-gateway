# transactions (ADR-017, E4b-2): /api/v1/transactions/ → transactions-api, resolved on every request.
# The credential filter ($transactions_without_credential, 10-security.conf) answers 401 before the
# service is called; the service still validates the token (ADR-020) and the webhook's checksum
# (ADR-019). The service's own errors pass through untouched.
location /api/v1/transactions/ {
    set $transactions_api http://transactions-api:8080;
    if ($transactions_without_credential) {
        return 401;
    }
    include /etc/nginx/snippets/api.conf;
    proxy_pass $transactions_api;
}
