# The portals of the interface (ADR-017): /portals/<name>/ → <name>-portal:80 with the prefix
# stripped, in the same origin as the container. Each portal is built with that prefix as its
# public base, so its chunks come back through here too. The name is resolved on every request.

# remoteEntry.js and the federation manifest are never cached (Annex H, rule 4): they decide which
# version of the portal the browser loads. Declaring a header here drops the server's, hence the
# snippet again.
location ~ ^/portals/(auth|catalog|transactions)/(remoteEntry\.js|mf-manifest\.json)$ {
    set $portal_upstream http://$1-portal:80/$2;
    proxy_pass $portal_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control no-store always;
}

location ~ ^/portals/(auth|catalog|transactions)/(.*)$ {
    set $portal_upstream http://$1-portal:80/$2$is_args$args;
    proxy_pass $portal_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# Any other name under /portals/ is not a portal; it must not fall through to the container.
location /portals/ {
    return 404;
}
